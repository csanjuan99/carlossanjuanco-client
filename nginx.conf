# Static hosting for the built SPA. Runs behind the Cloudflare Tunnel, so TLS,
# HTTP/2 and compression-in-transit are handled upstream; this only has to
# serve files correctly.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; index.html must never be cached or
    # visitors keep loading the previous deploy's asset references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Served by the tunnel, so the real client IP arrives in CF-Connecting-IP.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
